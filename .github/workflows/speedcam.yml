name: 更新測速照相資料
on:
  schedule:
    - cron: '17 19 * * *'   # 每天台灣時間 03:17
  workflow_dispatch:
  push:
    paths: ['scripts/speedcam.py', '.github/workflows/speedcam.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/speedcam.py
      - name: 有變動才 commit
        run: |
          git config user.name "xinglu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "測速資料自動更新" && git push)
